<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Student & Alumni Connect</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#003366;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:28px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:18px;
}

.hero{
    position:relative;
    height:80vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    overflow:hidden;
    color:white;
    text-align:center;
}

.hero video{
    position:absolute;
    top:50%;
    left:50%;
    min-width:100%;
    min-height:100%;
    width:auto;
    height:auto;
    transform:translate(-50%,-50%);
    object-fit:cover;
    z-index:0;
}

.hero::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.55);
    z-index:1;
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero h2{
    font-size:50px;
    text-shadow:2px 2px 6px rgba(0,0,0,.7);
}

.hero p{
    margin:20px;
    font-size:22px;
    text-shadow:1px 1px 4px rgba(0,0,0,.7);
}

button{
    padding:15px 35px;
    background:#ff9800;
    border:none;
    color:white;
    font-size:18px;
    border-radius:5px;
    cursor:pointer;
    transition:background .3s;
}

button:hover{
    background:#e68900;
}

section{
    padding:50px;
}

footer{
    background:#003366;
    color:white;
    text-align:center;
    padding:20px;
}
</style>

</head>
<body>

<header>

<h1>🎓 College Alumni Connect</h1>

<nav>
<a href="#">Home</a>
<a href="#contact">Contact</a>
</nav>

</header>

<section class="hero">

<video autoplay muted loop playsinline>
<source src="video.mp4" type="video/mp4">
</video>

<div class="hero-content">
<h2>Connect Students with Alumni</h2>

<p>
Build Professional Networks, Find Mentors,
Internships & Career Opportunities
</p>

<a href='login.html'> <button>
Get Started
</button> </a>
</div>

</section>

<section id="contact">

<h2 style="text-align:center;margin-bottom:30px;">
Contact Us
</h2>

<div style="text-align:center;">
<p>Email : alumni@college.edu</p>
<p>Phone : +91 9876543210</p>
<p>Address : ABC College Campus</p>
</div>

</section>

<footer>
<h3>© 2026 College Alumni Connect Portal</h3>
</footer>

</html>
