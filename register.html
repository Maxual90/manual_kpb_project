<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | College Alumni Connect</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(rgba(0,51,102,.8),rgba(0,51,102,.8)),
    url("https://images.unsplash.com/photo-1523050854058-8df90110c9f1");
    background-size:cover;
    background-position:center;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.login-box h2{
    text-align:center;
    color:#003366;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:18px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    color:#333;
    font-weight:bold;
}

.input-box input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:5px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#e68900;
}

.register{
    text-align:center;
    margin-top:20px;
    font-size:15px;
}

.register a{
    color:#003366;
    text-decoration:none;
    font-weight:bold;
}

.register a:hover{
    text-decoration:underline;
}
</style>

</head>
<body>

<div class="login-box">

<h2>College Alumni Connect</h2>

<form action='feed.html'>

<div class="input-box">
<label>Username</label>
<input type="text" placeholder="Enter your username" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" placeholder="Enter your password" required>
</div>

<button type="submit">Login</button>

</form>

<div class="register">
Don't have an account?
<a href="register_form.html">Register Now</a>
</div>

</div>

</body>
</html>
