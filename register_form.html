<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#4facfe,#00f2fe);
  padding:20px;
}
.container{
  width:400px;
  background:#fff;
  padding:35px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
h2{
  text-align:center;
  color:#003366;
  margin-bottom:20px;
}
label{
  display:block;
  margin-top:14px;
  margin-bottom:6px;
  font-weight:bold;
  color:#333;
  font-size:14px;
}
input[type="text"],
input[type="email"],
input[type="password"]{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:15px;
  outline:none;
  transition:0.3s;
}
input:focus{
  border-color:#007BFF;
  box-shadow:0 0 8px rgba(0,123,255,0.3);
}
.error-msg{
  color:#dc3545;
  font-size:13px;
  margin-top:4px;
  display:none;
}
input[type="submit"]{
  width:100%;
  margin-top:22px;
  padding:12px;
  background:#007BFF;
  color:white;
  border:none;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}
input[type="submit"]:hover{
  background:#0056b3;
}
</style>
</head>
<body>
<div class="container">
  <h2>Student Registration</h2>

  <form id="registerForm" action="register.php" method="POST">

    <label>Full Name</label>
    <input type="text" name="name" placeholder="Full Name" required>

    <label>Admission Number</label>
    <input type="text" name="admission_number" placeholder="e.g. 21CS045" required>

    <label>Email</label>
    <input type="email" name="email" id="email" placeholder="Email Address" required>

    <label>Batch</label>
    <input type="text" name="batch" placeholder="e.g. 2023-2027" required>

    <label>Course</label>
    <input type="text" name="course" placeholder="e.g. B.Tech CSE" required>

    <label>Password</label>
    <input type="password" name="password" id="password" placeholder="Password" required minlength="6">

    <label>Confirm Password</label>
    <input type="password" name="confirm_password" id="confirmPassword" placeholder="Re-enter Password" required minlength="6">
    <div class="error-msg" id="passwordError">Passwords do not match.</div>

    <input type="submit" value="Register">
  </form>
</div>

<script>
const form = document.getElementById('registerForm');
const password = document.getElementById('password');
const confirmPassword = document.getElementById('confirmPassword');
const passwordError = document.getElementById('passwordError');

form.addEventListener('submit', function (e) {
  let isValid = true;

  // password match check
  if (password.value !== confirmPassword.value) {
    passwordError.style.display = 'block';
    isValid = false;
  } else {
    passwordError.style.display = 'none';
  }

  if (!isValid) {
    e.preventDefault(); // stop form submission if errors exist
  }
});
</script>

</body>
</html>
