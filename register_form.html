<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#003366;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    font-weight:bold;
    color:#333;
}

input[type="text"],
input[type="email"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
    outline:none;
    transition:0.3s;
}

input[type="text"]:focus,
input[type="email"]:focus{
    border-color:#007BFF;
    box-shadow:0 0 8px rgba(0,123,255,0.3);
}

input[type="submit"]{
    width:100%;
    margin-top:25px;
    padding:12px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:6px;
    font-size:17px;
    cursor:pointer;
    transition:0.3s;
}

input[type="submit"]:hover{
    background:#0056b3;
}
</style>

</head>

<body>

<div class="container">

<h2>Student Registration</h2>

<form>

<label>Enter your Name</label>
<input type="text" name="name" placeholder="Full Name" required>

<label>Enter your Email</label>
<input type="email" name="email" placeholder="Email Address" required>

<label>Enter your Batch</label>
<input type="text" name="batch" placeholder="e.g. 2023-2027" required>

<input type="submit" value="Register">

</form>

</div>

</html>
